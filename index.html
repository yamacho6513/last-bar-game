<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RADIA QUEST</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{font-family:monospace}#game{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#pad{display:none;position:fixed;left:18px;bottom:18px;width:148px;height:148px;border:3px solid #ffffff88;border-radius:50%;background:#0009;color:#fff}
.k{position:absolute;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:27px;user-select:none;-webkit-user-select:none}
#u{left:49px;top:1px}#d{left:49px;bottom:1px}#l{left:1px;top:49px}#r{right:1px;top:49px}
#a{left:49px;top:49px;border:2px solid #ffffff99;border-radius:50%;font-size:18px}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="pad"><div class="k" id="u">▲</div><div class="k" id="d">▼</div><div class="k" id="l">◀</div><div class="k" id="r">▶</div><div class="k" id="a">A</div></div>
<script>
const c=document.getElementById('game'),g=c.getContext('2d'),pad=document.getElementById('pad');
let W,H,state='title',fade=0,keys={},player={x:.5,y:.76},scroll=0,last=performance.now();
const title=new Image(); title.src='title.png';
function resize(){W=c.width=innerWidth;H=c.height=innerHeight} resize(); addEventListener('resize',resize);
function pressA(){ if(state==='title'){state='fadeout';fade=0;} }
['u','d','l','r'].forEach(id=>{const e=document.getElementById(id);e.onpointerdown=v=>{v.preventDefault();keys[id]=1;e.setPointerCapture(v.pointerId)};e.onpointerup=e.onpointercancel=()=>keys[id]=0});
document.getElementById('a').onpointerdown=e=>{e.preventDefault();pressA()};
addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){pressA();e.preventDefault()} if(e.key==='ArrowUp')keys.u=1;if(e.key==='ArrowDown')keys.d=1;if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1});
addEventListener('keyup',e=>{if(e.key==='ArrowUp')keys.u=0;if(e.key==='ArrowDown')keys.d=0;if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0});
c.addEventListener('pointerdown',()=>{if(state==='title')pressA()});

function drawTitle(){
 g.fillStyle='#061a23';g.fillRect(0,0,W,H);
 if(title.complete){
   const ir=title.width/title.height, sr=W/H; let dw,dh,dx,dy;
   if(sr>ir){dh=H;dw=H*ir;dx=(W-dw)/2;dy=0}else{dw=W;dh=W/ir;dx=0;dy=(H-dh)/2}
   g.drawImage(title,dx,dy,dw,dh);
 }
}
function building(x,y,w,h,label){
 g.fillStyle='#2b2020';g.fillRect(x,y,w,h);g.fillStyle='#b9a88c';g.fillRect(x+3,y+3,w-6,h-6);
 g.fillStyle='#261b18';g.font='bold 12px monospace';g.textAlign='center';g.fillText(label,x+w/2,y+h/2+4);
}
function drawStreet(dt){
 const roadW=Math.min(W*.54,260),rx=(W-roadW)/2;
 g.fillStyle='#071015';g.fillRect(0,0,W,H);
 g.fillStyle='#d2cec0';g.fillRect(rx,0,roadW,H);
 g.fillStyle='#aaa89f';for(let y=(-scroll%38)-38;y<H;y+=38)g.fillRect(rx,y,roadW,2);
 g.fillStyle='#8f2525';g.fillRect(rx,48,roadW,9);
 const off=scroll%170;
 building(rx-roadW*.52,95+off-170,roadW*.48,92,'カラオケ');
 building(rx+roadW+8,135+off-170,roadW*.46,110,'居酒屋');
 building(rx-roadW*.55,280+off-170,roadW*.51,120,'月世界');
 building(rx+roadW+8,325+off-170,roadW*.48,105,'BAR');
 building(rx-roadW*.52,485+off-170,roadW*.48,100,'たこ焼き');
 building(rx+roadW+8,515+off-170,roadW*.50,125,'東門ビレッジ');
 // hero back view
 const px=W*player.x,py=H*player.y;
 g.fillStyle='#d8b06b';g.fillRect(px-6,py-14,12,7);
 g.fillStyle='#315f9d';g.fillRect(px-9,py-7,18,19);
 g.fillStyle='#d6d8dc';g.fillRect(px+7,py-5,5,16);
 g.fillStyle='#8b623f';g.fillRect(px-8,py+12,6,7);g.fillRect(px+2,py+12,6,7);
 if(keys.u)scroll+=dt*.11;if(keys.d)scroll-=dt*.11;
 if(keys.l)player.x-=dt*.00035;if(keys.r)player.x+=dt*.00035;
 player.x=Math.max(.32,Math.min(.68,player.x));
}
function loop(t){
 const dt=Math.min(40,t-last);last=t;g.clearRect(0,0,W,H);
 if(state==='title'){drawTitle();pad.style.display='none'}
 else if(state==='fadeout'){drawTitle();fade+=dt/450;g.fillStyle=`rgba(0,0,0,${Math.min(1,fade)})`;g.fillRect(0,0,W,H);if(fade>=1){state='fadein';fade=1;pad.style.display='block'}}
 else if(state==='fadein'){drawStreet(dt);fade-=dt/450;g.fillStyle=`rgba(0,0,0,${Math.max(0,fade)})`;g.fillRect(0,0,W,H);if(fade<=0)state='street'}
 else drawStreet(dt);
 requestAnimationFrame(loop)
}requestAnimationFrame(loop);
</script></body></html>
