<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RADIA QUEST - Motion Test</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;font-family:monospace}
  #game{display:block;width:100vw;height:100vh;background:#071015}
  #pad{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:150px;height:150px;border:3px solid #ffffff66;border-radius:50%;background:#0008}
  .dir,.a{position:absolute;color:white;text-align:center;font-weight:bold}
  .dir{font-size:24px;width:48px;height:48px;line-height:48px}
  #up{left:51px;top:3px} #down{left:51px;bottom:3px} #left{left:3px;top:51px} #right{right:3px;top:51px}
  .a{left:49px;top:49px;width:52px;height:52px;line-height:52px;border:2px solid #fff8;border-radius:50%;background:#ffffff18;font-size:20px}
  #hint{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));color:#fff9;font-size:11px;text-align:right}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="pad">
  <div class="dir" id="up">▲</div><div class="dir" id="down">▼</div>
  <div class="dir" id="left">◀</div><div class="dir" id="right">▶</div>
  <div class="a" id="a">A</div>
</div>
<div id="hint">RADIA QUEST<br>movement test</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W,H,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const world={w:720,h:2500};
let p={x:360,y:2240,r:13,s:185}, keys={up:0,down:0,left:0,right:0}, last=performance.now();
let taxi1=0,taxi2=420;

function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}
function label(t,a,b,size=15,col='#fff'){x.fillStyle=col;x.font=`bold ${size}px monospace`;x.textAlign='center';x.fillText(t,a,b)}
function building(side,y,h,name,col){
  let bx=side==='L'?55:475,bw=190;
  rect(bx,y,bw,h,col);rect(bx+8,y+8,bw-16,h-16,'#182028');
  label(name,bx+bw/2,y+h/2+5,14,'#f1e7cf');
}
function taxi(y,tx,flip=false){
  let px=flip?world.w-(tx%(world.w+120))-60:(tx%(world.w+120))-60;
  rect(px,y,58,25,'#f1c928');rect(px+10,y-8,35,12,'#bfe7ef');
  rect(px+6,y+22,12,6,'#111');rect(px+40,y+22,12,6,'#111');
}
function drawWorld(camY){
  x.save();x.translate((W-world.w)/2,-camY);
  rect(0,0,world.w,world.h,'#0a1116');
  // roads crossing north and south
  rect(0,70,world.w,150,'#252a2d'); rect(0,2280,world.w,150,'#252a2d');
  for(let i=0;i<world.w;i+=70){rect(i,142,38,4,'#e9e2ba');rect(i,2352,38,4,'#e9e2ba')}
  taxi(112,taxi1,false);taxi(2318,taxi2,true);

  // main Higashimon street, with a subtle curve
  x.strokeStyle='#d9d6cb';x.lineWidth=190;x.lineCap='butt';
  x.beginPath();x.moveTo(360,2360);x.bezierCurveTo(345,1850,380,1250,350,140);x.stroke();
  x.strokeStyle='#b9b6ad';x.lineWidth=3;x.setLineDash([18,18]);
  x.beginPath();x.moveTo(360,2280);x.bezierCurveTo(345,1800,380,1200,350,220);x.stroke();x.setLineDash([]);

  // placeholder gates
  rect(270,2195,180,13,'#b73535');rect(285,2165,12,45,'#b73535');rect(423,2165,12,45,'#b73535');
  rect(260,235,180,13,'#b73535');rect(275,235,12,45,'#b73535');rect(413,235,12,45,'#b73535');

  // placeholder buildings in correct south -> north order
  building('L',2030,130,'カラオケ館','#74444c');
  building('L',1870,110,'無料案内所','#565071');
  building('L',1680,150,'クラブ月世界','#553b67');
  building('L',1490,140,'鍋料理','#604b39');
  building('L',1250,125,'たこ焼き','#70513c');
  building('L',1060,145,'マンション','#555b61');
  building('L',875,145,'ホテル','#5d5060');
  building('L',660,160,'雑居ビル','#4e5156');

  building('R',1990,145,'居酒屋 / 焼肉','#5e473c');
  building('R',1810,125,'PARKING','#41484c');
  building('R',1600,160,'BAR','#4b4058');
  building('R',1400,145,'リカーマウンテン','#4b5d48');
  building('R',1220,130,'電気屋','#4d5860');
  building('R',1010,165,'東門ビレッジ','#5b4a42');
  building('R',810,140,'酒屋','#515d4c');
  building('R',590,170,'スナック / BAR','#504353');

  // shrine side alley trigger marker
  rect(235,1190,105,65,'#77736b');label('← 生田神社',285,1228,12,'#402a25');

  // player
  rect(p.x-11,p.y-13,22,26,'#315f9d');rect(p.x-7,p.y-19,14,8,'#d7b07c');
  x.restore();
}
function update(dt){
  let dx=keys.right-keys.left,dy=keys.down-keys.up;
  if(dx||dy){let n=Math.hypot(dx,dy);p.x+=dx/n*p.s*dt;p.y+=dy/n*p.s*dt}
  p.x=Math.max(275,Math.min(445,p.x));p.y=Math.max(245,Math.min(2390,p.y));
  taxi1+=120*dt;taxi2+=105*dt;
}
function frame(t){
  let dt=Math.min((t-last)/1000,.035);last=t;update(dt);
  let cam=Math.max(0,Math.min(world.h-H,p.y-H*.58));
  x.clearRect(0,0,W,H);drawWorld(cam);
  requestAnimationFrame(frame);
}
function bind(id,k){
 let el=document.getElementById(id);
 const on=e=>{e.preventDefault();keys[k]=1},off=e=>{e.preventDefault();keys[k]=0};
 el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bind('up','up');bind('down','down');bind('left','left');bind('right','right');
addEventListener('keydown',e=>{if(e.key==='ArrowUp')keys.up=1;if(e.key==='ArrowDown')keys.down=1;if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1});
addEventListener('keyup',e=>{if(e.key==='ArrowUp')keys.up=0;if(e.key==='ArrowDown')keys.down=0;if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0});
requestAnimationFrame(frame);
</script>
</body>
</html>
